<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HMS - Login Form</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        .message-box {
            padding: 12px 16px;
            margin-top: 16px;
            border-radius: 8px;
            background-color: #fde8e8;
            color: #b91c1c;
            border: 1px solid #f5b7b7;
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Left side: image slideshow -->
        <div class="left">

            <img
                src="login_pics/pic_1.png"
                class="slide active"
                alt="Picture 1"
            >

            <img
                src="login_pics/pic_2.png"
                class="slide"
                alt="Picture 2"
            >

            <img
                src="login_pics/pic_3.png"
                class="slide"
                alt="Picture 3"
            >

        </div>

        <!-- Right side: login form -->
        <div class="right">
            <div class="form-container">

                <h1>Hospital Management System</h1>

                <form action="login_back_end.php" method="POST" id="LoginForm">

                    <div class="text-box">
                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            placeholder="Enter your username"
                            autocomplete="username"
                        >
                    </div>

                    <div class="pad"></div>

                    <div class="text-box">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="pad"></div>

                    <input
                        type="submit"
                        value="Submit"
                        class="submit-button"
                        name="Login"
                    >

                </form>

                <div id="message" class="message-box" role="alert" hidden></div>

                <!-- Display message box instead of echo -->
                <!-- <?php if ($message !== ''): ?>
                    <div class="message-box" role="alert">
                        <?= htmlspecialchars(
                            $message,
                            ENT_QUOTES,
                            'UTF-8'
                        ) ?>
                    </div>
                <?php endif; ?> -->

            </div>
        </div>

    </div>

    <script>
        const slides = document.querySelectorAll(".slide");
        let currentIndex = 0;

        function changeSlide() {
            if (slides.length === 0) return;

            slides[currentIndex].classList.remove("active");

            currentIndex = (currentIndex + 1) % slides.length;

            slides[currentIndex].classList.add("active");
        }

        // Change image every 4 seconds
        if (slides.length > 1) {
            setInterval(changeSlide, 4000);
        }

        const form = document.getElementById("LoginForm");
        const message = document.getElementById("message");
        const username = document.getElementById("name");
        const password = document.getElementById("password");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.hidden = true;
            message.textContent = "";

            try {
                const response = await fetch("login_back_end.php", {
                    method: "POST",
                    body: new FormData(form)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = result.redirect;
                    return;
                }

                message.textContent = result.message;
                message.hidden = false;

                username.addEventListener("input", function () {
                    message.hidden = true;
                    message.textContent = "";
                });

                password.addEventListener("input", function () {
                    message.hidden = true;
                    message.textContent = "";
                });

            } catch (error) {
                message.textContent =
                    "Cannot connect to the server. Please try again.";
                message.hidden = false;

                console.error(error);
            }
        });
    </script>
</body>
</html>
