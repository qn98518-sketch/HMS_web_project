<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Users Management</title>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="users_management.css">
    <script src="/SDLC/Hospital_Management_System_new/Hospital_Management_System/admin_form/js/auth.js" defer></script>
</head>

<body data-page="users">

<div class="wrapper">

    <aside id="sidebar"></aside>

    <div class="main">

        <header id="topbar"></header>

        <main id="content">

            <div class="users-page">

                <!-- ================= Header ================= -->
                <div class="page-header">
                    <div>
                        <h2>Users Management</h2>
                        <p>Manage all user accounts in the system.</p>
                    </div>

                    <button class="btn btn-primary" id="btnAddUser" type="button">
                        <svg class="icon"><use href="#i-plus"/></svg>
                        Add Account
                    </button>
                </div>

                <!-- ================= Toolbar ================= -->
                <div class="toolbar">

                    <div class="search-box">
                        <svg class="icon"><use href="#i-search"/></svg>
                        <input type="text" id="txtSearch" placeholder="Search username, full name...">
                    </div>

                    <select id="filterRole">
                        <option value="">All Roles</option>
                        <option>Admin</option>
                        <option>Doctor</option>
                        <option>Nurse</option>
                        <option>Receptionist</option>
                    </select>

                    <select id="filterStatus">
                        <option value="">All Status</option>
                        <option value="1">Active</option>
                        <option value="0">Disabled</option>
                    </select>

                </div>

                <!-- ================= Table ================= -->
                <div class="table-card">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Full Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th width="120">Actions</th>
                            </tr>
                        </thead>

                        <!-- users.js render here -->
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>

            </div>

        </main>

    </div>

</div>

<!-- ====================================================== -->
<!-- Add / Edit Modal -->
<!-- ====================================================== -->
<div class="modal" id="userModal">
    <div class="modal-box">

        <div class="modal-header">
            <h3 id="modalTitle">Add Account</h3>
            <button id="closeModal" type="button">&times;</button>
        </div>

        <div class="modal-body">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role">
                    <option>Admin</option>
                    <option>Doctor</option>
                    <option>Nurse</option>
                    <option>Receptionist</option>
                    <option>Patient</option>
                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="1">Active</option>
                    <option value="0">Disabled</option>
                </select>
            </div>

        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="btnSave" type="button">Save</button>
        </div>

    </div>
</div>

<!-- ====================================================== -->
<!-- Delete Modal -->
<!-- ====================================================== -->
<div class="modal" id="deleteModal">
    <div class="delete-box">

        <h3>Delete Account</h3>
        <p>Are you sure you want to delete this account?</p>

        <div class="delete-buttons">
            <button class="btn btn-secondary" id="cancelDelete" type="button">Cancel</button>
            <button class="btn btn-danger" id="confirmDelete" type="button">Delete</button>
        </div>

    </div>
</div>

<script src="../js/layout.js"></script>
<script src="users.js"></script>

</body>
</html>
